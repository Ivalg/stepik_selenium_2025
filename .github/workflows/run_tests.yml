name: Automated tests

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Choose target
        required: true
        default: all_tests
        type: choice
        options:
          - all_tests
          - need_review_tests
          - new_year_promo_tests

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Chrome
        run: sudo apt-get install google-chrome-stable
      - name: install dependencies
        run: pip install -r requirements.txt
      - name: all_tests
        if: "github.event.inputs.deployment_target == 'all_tests'"
        run: pytest
      - name: need_review_tests
        if: "github.event.inputs.deployment_target == 'need_review_tests'"
        run: pytest -m need_review
      - name: new_year_promo_tests
        if: "github.event.inputs.deployment_target == 'new_year_promo_tests'"
        run: pytest -m new_year_promo